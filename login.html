<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Sign In - Stackly</title><link rel="stylesheet" href="css/style.css" /><link rel="stylesheet" href="css/auth.css?v=4" /><script src="js/auth.js"></script></head><body>
<div class="auth-page"><div class="auth-card"><a href="index.html" class="back-btn-top">&larr; Back to Home</a><div class="auth-logo"><a href="index.html"><img src="images/logo-stackly.webp" alt="Stackly" /></a></div><h2 class="auth-title">Welcome Back</h2><p class="auth-subtitle">Sign in to access your agriculture dashboard</p>
<div class="role-selector" id="roleSelector"><button class="role-option active" data-role="operator" onclick="selectRole(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Operator</button><button class="role-option" data-role="admin" onclick="selectRole(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Admin</button></div>
<form onsubmit="event.preventDefault();handleLogin()"><div class="form-group"><label>Email <span class="required">*</span></label><input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required /><div class="form-error"></div></div><div class="form-group"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;"><label style="margin-bottom:0;">Password <span class="required">*</span></label><a href="404.html" style="font-size:0.85rem;text-decoration:none;color:#7cb342;">Forgot password?</a></div><div class="password-wrapper"><input type="password" class="form-control" id="loginPassword" placeholder="Min 8 chars..." required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}" title="Password must contain at least 8 characters, one uppercase, one lowercase, one number and one special character" /><button type="button" class="password-toggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="form-error"></div></div><button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign In</button></form>
<div class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></div></div></div>
<script>let selectedRole='operator';function selectRole(el){document.querySelectorAll('.role-option').forEach(o=>o.classList.remove('active'));el.classList.add('active');selectedRole=el.dataset.role;}function handleLogin(){const email=document.getElementById('loginEmail').value;const password=document.getElementById('loginPassword').value;const result=authLogin(email,password,selectedRole);if(result.success){window.location.href='dashboard.html';}}</script>
<script src="js/main.js"></script></body></html>
