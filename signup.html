<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Sign Up - Stackly</title><link rel="stylesheet" href="css/style.css" /><link rel="stylesheet" href="css/auth.css?v=4" /><script src="js/auth.js"></script></head><body>
<div class="auth-page"><div class="auth-card"><a href="index.html" class="back-btn-top">&larr; Back to Home</a><div class="auth-logo"><a href="index.html"><img src="images/logo-stackly.webp" alt="Stackly" /></a></div><h2 class="auth-title">Create Account</h2><p class="auth-subtitle">Join Stackly Smart Agriculture today</p>
<div class="role-selector" id="roleSelector"><button class="role-option active" data-role="operator" onclick="selectRole(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Operator</button><button class="role-option" data-role="admin" onclick="selectRole(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Admin</button></div>
<form onsubmit="event.preventDefault();handleSignup()">
<div class="form-row"><div class="form-group"><label>First Name <span class="required">*</span></label><input type="text" class="form-control" id="signupFirst" placeholder="John" pattern="[A-Za-z\s]+" title="Only letters and spaces are allowed" required /><div class="form-error"></div></div><div class="form-group"><label>Last Name <span class="required">*</span></label><input type="text" class="form-control" id="signupLast" placeholder="Doe" pattern="[A-Za-z\s]+" title="Only letters and spaces are allowed" required /><div class="form-error"></div></div></div>
<div class="form-group"><label>Email <span class="required">*</span></label><input type="email" class="form-control" id="signupEmail" placeholder="john@example.com" required /><div class="form-error"></div></div>
<div class="form-group"><label>Phone <span class="required">*</span></label><input type="tel" class="form-control" id="signupPhone" placeholder="9876543210" pattern="[0-9]{10}" title="Please enter exactly 10 digits" required /><div class="form-error"></div></div>
<div class="form-row"><div class="form-group"><label>Password <span class="required">*</span></label><div class="password-wrapper"><input type="password" class="form-control" id="signupPassword" placeholder="Min 8 chars..." required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}" title="Password must contain at least 8 characters, one uppercase, one lowercase, one number and one special character" /><button type="button" class="password-toggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="form-group"><label>Confirm <span class="required">*</span></label><div class="password-wrapper"><input type="password" class="form-control" id="signupConfirm" placeholder="Confirm Password" required minlength="8" /><button type="button" class="password-toggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div></div>
<div id="signupError" style="color:red;font-size:0.85rem;margin-bottom:1rem;text-align:center;"></div>
<button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Create Account</button></form>
<div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div></div></div>
<script>let selectedRole='operator';function selectRole(el){document.querySelectorAll('.role-option').forEach(o=>o.classList.remove('active'));el.classList.add('active');selectedRole=el.dataset.role;}function handleSignup(){const name=document.getElementById('signupFirst').value+' '+document.getElementById('signupLast').value;const email=document.getElementById('signupEmail').value;const password=document.getElementById('signupPassword').value;const confirm=document.getElementById('signupConfirm').value;const phone=document.getElementById('signupPhone').value;if(password!==confirm){document.getElementById('signupError').innerText="Passwords do not match!";return;}document.getElementById('signupError').innerText="";const result=authSignup(name,email,password,phone,selectedRole);if(result.success){alert('Account created successfully! Please sign in.');window.location.href='login.html';}else{document.getElementById('signupError').innerText="Signup failed.";}}</script>
<script src="js/main.js"></script></body></html>
